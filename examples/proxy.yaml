# A configuration file for fprime-dict-to-cpp, holding everything the flags hold:
#
#     fprime-dict-to-cpp --config examples/proxy.yaml
#
# Anything given on the command line as well wins over what is written here, so this
# file is a starting point rather than a straitjacket:
#
#     fprime-dict-to-cpp --config examples/proxy.yaml -o build-artifacts/RefProxy
#
# `fprime-dict-to-cpp -i <dictionary>` writes a file like this one for a new component,
# with the same keys and the same comments, so this is a reference rather than a
# starting point you have to copy.

# Relative dictionary and output paths resolve against *this file's* directory, so the
# configuration keeps working from whatever directory it is run in.
dictionary: ../tests/data/RefTopologyDictionary.json
output: ../build-artifacts/RefProxy

component: RefProxy
namespace: RefProxy

# active (default): decode on the component's own thread.  queued: on whatever drives
# its run port.  passive: on the caller's thread.
kind: active

# instance (default) | qualified | source-case | member.  The two knobs the presets
# combine are name-qualification and name-style, if a preset is not quite right.
naming: instance
# name-qualification: full
# name-style: source-case

# Individual members named outright, in place of whatever the scheme above would call
# them: dictionary name on the left, the name the generated component declares on the
# right.  Everything not listed is still mangled by the scheme, and mangling routes
# around these -- an automatic name that would have collided with a chosen one is the
# one that moves.
#
# A key that matches nothing in the dictionary is an error, not a no-op, so this table
# cannot quietly outlive the dictionary it was written for.
names:
  Ref.dpDemo.SelectColor: SelectDemoColor
  CdhCore.cmdDisp.CMD_NO_OP: NoOp

# The same for generated type names, which are otherwise the dictionary's qualified name
# flattened: Ref.DpDemo.ColorEnum becomes Ref_DpDemo_ColorEnum.  An override is used
# exactly as written -- type-prefix is not applied to it.
type-names:
  Ref.DpDemo.ColorEnum: DemoColor

# Members the component does not declare, as dictionary names or fnmatch globs.  An
# omitted member gets no command, event or telemetry declaration, and so no entry in
# this deployment's ground dictionary -- but it keeps any port hooked onto it below, and
# that is the combination that gives a proxy nothing but port traffic.
#
# A name or pattern matching nothing in the dictionary is an error, not a no-op.  Local
# ids are dense over what remains, so omitting a member renumbers the ones after it,
# which is reported as a warning.
# omit:
#   - "Ref.dpDemo.*"
#   - "*_PRM_SET"

# Commands to hook an input port onto.  Invoking the port serializes the remote's opcode
# and the port's arguments into a command packet and sends it, with no ground command and
# no command response in the way -- which is how flight software commands the remote.
#
# true takes the derived port name (dpDemo_SelectColor -> dpDemo_SelectColor_cmdIn); a
# string names the port outright; false is the same as leaving the line out, so a hook
# can be switched off without losing the note about it.  The port's own type is generated
# into <Component>Types.fpp with the command's formals, so it cannot be handed the wrong
# arguments.
# command-ports:
#   Ref.dpDemo.SelectColor: true
#   CdhCore.cmdDisp.CMD_NO_OP: pingRemote

# Events to hook an output port onto, which fires with the event's own arguments when one
# arrives from the remote.  Spelled as command-ports is.
# event-ports:
#   CdhCore.cmdDisp.OpCodeDispatched: true

# Telemetry channels to hook an output port onto.  The port carries the value and the
# timestamp the REMOTE reported, which is the same pair the generated tlmWrite_ helper is
# given.
# telemetry-ports:
#   CdhCore.cmdDisp.CommandsDispatched: true

# Telemetry packets to hook an output port onto, keyed <packet set>.<packet>.  The port
# carries one formal per channel of the packet in wire order, then the single timestamp
# they all share.  A packet is a layout rather than a declared member, so there is
# nothing in omit for one: a packet port is what makes a packet visible at all.
# packet-ports:
#   RefPackets.CDH: true

# Prepend this to every generated type name, if one would otherwise clash with a
# framework type of the same leaf name.
type-prefix: ""

# Path prefix for the #include of the autocoded base class; normally the component's
# directory relative to the project root.  Defaults to the output directory's name, and
# unlike the paths above it is an include path, not a filesystem path.
# include-prefix: Ref/RefProxy

# These read positively, where the flags that set them read negatively
# (--no-packetized, --no-diagnostics).
packetized: true
diagnostics: true

# true for clang-format's own default style, or name one: clang-format: Google
clang-format: false

# Rewrite CMakeLists.txt from the current file list.  Off, so that whatever this
# project has added to it -- a dependency the FPP model does not imply, a target
# property -- survives a regeneration.  Turn it on when the file list itself changes,
# which is what turning packetized off does.
cmake: false

# Also parse the dictionary with fprime-gds and report any disagreement.
cross-check: false

# dry-run: report what would be generated without writing it.  quiet: only warnings
# and errors.
dry-run: false
quiet: false
